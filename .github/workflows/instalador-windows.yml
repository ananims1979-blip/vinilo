# Arma el instalador de Windows de la app en una computadora de GitHub.
# Se ejecuta solo cada vez que subes cambios, o con el botón "Run workflow".
name: Instalador de Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Copiar el proyecto
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Buscar la carpeta del proyecto
        run: |
          archivo=$(git ls-files 'package.json' '*/package.json' | head -1)
          if [ -z "$archivo" ]; then echo "No se encontró package.json. Sube los archivos de la app."; exit 1; fi
          echo "CARPETA=$(dirname "$archivo")" >> "$GITHUB_ENV"

      - name: Instalar lo necesario
        working-directory: ${{ env.CARPETA }}
        run: npm install

      - name: Armar el instalador
        working-directory: ${{ env.CARPETA }}
        run: |
          node preparar.js
          npx electron-builder --win --x64 --publish never

      - name: Guardar el instalador para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Windows
          path: ${{ env.CARPETA }}/dist/*.exe
          if-no-files-found: error
